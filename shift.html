<title>AgroShift</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{--g:#0f3d28;--g2:#2f8f57;--lime:#b9e769;--bg:#f2f6f3;--c:#fff;--t:#14231a;--m:#62786b;--b:#dde8e1;--r:#d0472f;--y:#d99a1c;--bl:#2a74b8;--sh:0 6px 24px rgba(15,61,40,.07)}
*{box-sizing:border-box}body{margin:0;font:15px/1.55 "Plus Jakarta Sans","Cairo","Segoe UI",sans-serif;background:var(--bg);color:var(--t);display:flex;min-height:100vh}
[dir=rtl] body,[dir=rtl]{font-family:"Cairo","Plus Jakarta Sans",sans-serif}
aside{width:262px;background:linear-gradient(180deg,#0f3d28,#1a5c3a);color:#cfe6d7;padding:20px 14px;position:sticky;top:0;height:100vh;overflow:auto;flex:none}
.logo{display:flex;gap:10px;align-items:center;margin:0 6px 14px}.logo i{font-style:normal;background:var(--g2);width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-size:22px}
.logo b{font-size:19px;color:#fff;display:block;line-height:1.1}.logo small{color:#9cc5aa;font-size:12px}
.gt{font-size:11px;letter-spacing:.08em;color:#7fae90;margin:16px 10px 4px;font-weight:600}
aside a{display:flex;gap:10px;padding:8px 12px;border-radius:10px;color:inherit;cursor:pointer;font-size:14px;transition:.15s}
aside a:hover{background:rgba(255,255,255,.08)}aside a.on{background:var(--lime);color:#0f3d28;font-weight:600}
main{flex:1;min-width:0}header{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:12px 28px;background:rgba(255,255,255,.9);backdrop-filter:blur(8px);border-bottom:1px solid var(--b);position:sticky;top:0;z-index:900}
header .sp{flex:1}.bc{color:var(--m);font-size:13px}
select,input,button{font:inherit;padding:8px 12px;border:1px solid var(--b);border-radius:10px;background:#fff;color:var(--t)}
button{cursor:pointer}button:hover{border-color:var(--g2)}button.p{background:var(--g2);color:#fff;border:0;font-weight:600;padding:11px 20px}button.p:hover{background:var(--g)}
.pg{display:none;padding:26px 28px 50px;max-width:1200px}.pg.on{display:block}
.card{background:var(--c);border:1px solid var(--b);border-radius:18px;padding:20px;margin-bottom:18px;box-shadow:var(--sh)}
h2{margin:0 0 4px;font-size:26px;font-weight:800;color:var(--g)}h3{margin:0 0 10px;font-size:16px;color:var(--g)}.sub{color:var(--m);margin:0 0 18px}
.map{height:420px;border-radius:14px;z-index:1}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.tb{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:18px}.k{background:var(--c);border:1px solid var(--b);border-radius:16px;padding:14px 16px;box-shadow:var(--sh)}
.k small{color:var(--m);display:block}.k b{font-size:24px;font-weight:800}.k em{font-style:normal;font-size:12px;color:var(--m)}
.k.l1{border-top:4px solid var(--y)}.k.l2{border-top:4px solid var(--r)}.k.l0{border-top:4px solid var(--g2)}
.sl{display:grid;grid-template-columns:150px 1fr 26px;gap:8px;align-items:center;margin:6px 0}.sl input{padding:0;accent-color:var(--g2);width:100%}
.bar{height:10px;background:#e6eee9;border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--g2)}
.row{display:grid;grid-template-columns:150px 1fr 48px;gap:8px;align-items:center;margin:5px 0;font-size:14px}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:8px;border-bottom:1px solid var(--b);text-align:start}th{color:var(--m);font-weight:600}
.pill{display:inline-block;padding:2px 11px;border-radius:12px;background:#e3f2e8;color:var(--g);margin:2px;font-size:13px;font-weight:600}.w{background:#fbe9e4;color:var(--r)}
.note{border-inline-start:4px solid var(--y);background:#fbf5e3;padding:10px 14px;border-radius:8px;margin:8px 0}.ok{border-color:var(--g2);background:#e8f5ed}
.hide{display:none!important}.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px}.kv b{color:var(--m);font-weight:600}
.chips button{border-radius:20px;padding:6px 14px}canvas{max-height:340px}#al{position:fixed;inset-inline-end:28px;top:58px;width:320px;background:#fff;border:1px solid var(--b);border-radius:14px;box-shadow:var(--sh);padding:14px;display:none}
.leg{font-size:12px;color:var(--m)}
@media(max-width:860px){body{display:block}aside{width:auto;height:auto;position:static}.grid{grid-template-columns:1fr}.pg{padding:18px}}
@media print{aside,header,.tb,button,.map{display:none!important}.pg{display:none}.pg.on{display:block}}
</style></head><body>

<div class="card"><h3 data-i="ahp"></h3><p class="sub" data-i="ahp_s"></p><div class="chips tb" id="presets"></div><div id="sl"></div>
<label><input type="checkbox" id="well" style="width:auto"> <span data-i="well"></span></label><br><br><button class="p" id="go" data-i="run"></button></div>

<div class="card"><h3 data-i="r_land"></h3><div id="o_land"></div></div>

<div class="card"><h3 data-i="r_adv"></h3><div id="o_adv"></div><div class="tb" style="margin-top:12px"><input id="fname" data-ph="fname"><button id="fsave" data-i="save"></button></div></div></div>

m:["<p><b>AHP</b>: your 1-9 priorities become a pairwise matrix; its principal eigenvector gives the weights.</p><p><b>Random Forest</b>: learns from satellite history (NDVI, ET, soil moisture, bare-soil months) how each crop and the two previous crops behave in a cell. Validated with spatial-block cross-validation against a per-crop average.</p><p><b>Scoring</b>: each scenario is compared with the current wheat-sorghum-fallow rotation (±30% = full score).</p><p><b>Monitoring pages</b>: ERA5 / ERA5-Land reanalysis through Open-Meteo, standardized anomalies against 1985-today.</p><p><b>Limits</b>: the Random Forest is trained on Finney County, Kansas. Elsewhere, results use county averages adjusted by your own yields. Soil and economic priors need local validation.</p>","<p><b>AHP</b> : vos priorités 1-9 forment une matrice de comparaisons dont le vecteur propre donne les poids.</p><p><b>Random Forest</b> : apprend de l’historique satellite comment chaque culture et les deux précédentes se comportent. Validé par validation croisée spatiale.</p><p><b>Score</b> : comparaison à la rotation actuelle blé-sorgho-jachère (±30 % = score max).</p><p><b>Suivi</b> : réanalyses ERA5 via Open-Meteo, anomalies standardisées vs 1985-aujourd’hui.</p><p><b>Limites</b> : entraîné sur le comté de Finney (Kansas). Ailleurs : moyennes du comté ajustées à vos rendements.</p>","<p><b>AHP</b>: تتحول أولوياتك (1-9) إلى مصفوفة مقارنات ومتجهها الذاتي يعطي الأوزان.</p><p><b>Random Forest</b>: يتعلم من تاريخ الأقمار سلوك كل محصول والمحصولين السابقين. جرى التحقق بالتحقق المتقاطع المكاني.</p><p><b>التقييم</b>: مقارنة بالدورة الحالية قمح-ذرة رفيعة-بور (±30% = درجة كاملة).</p><p><b>المراقبة</b>: إعادة تحليل ERA5 عبر Open-Meteo مع انحرافات معيارية مقابل 1985-اليوم.</p><p><b>الحدود</b>: النموذج مدرَّب على مقاطعة فيني (كانساس). في غيرها تُستعمل متوسطات المقاطعة معدّلة بمردودك.</p>"],
a:["<p>AgroShift turns satellite and climate data into rotation advice that farmers, advisers and researchers can read. It supports decisions, it never replaces them. Methods, thresholds and uncertainty are always visible, and we say where local validation is needed.</p>","<p>AgroShift transforme données satellites et climatiques en conseils de rotation lisibles par agriculteurs, conseillers et chercheurs. Un appui, jamais un remplacement. Méthodes, seuils et incertitudes restent visibles.</p>","<p>AgroShift يحوّل بيانات الأقمار والمناخ إلى نصائح دورة زراعية يفهمها الفلاح والمرشد والباحث. هو دعم للقرار لا بديل عنه. المنهجيات والعتبات وعدم اليقين ظاهرة دائماً.</p>"]};
